services:
  # Backend FastAPI Service
  - type: web
    name: service-big-data-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: ALLOWED_ORIGINS
        value: https://aransyah28.github.io
